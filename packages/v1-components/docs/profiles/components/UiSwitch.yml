component: UiSwitch
summary: >
  UiSwitch is a compact boolean toggle control. It is the most concise choice for on or off state
  when checkbox semantics would feel visually heavy.

public_import:
  from: '@retailcrm/embed-ui-v1-components/remote'
  named:
    - UiSwitch

examples:
  - title: Basic switch
    code: |
      <template>
        <UiSwitch v-model:value="enabled" />
      </template>

      <script lang="ts" setup>
      import { ref } from 'vue'
      import { UiSwitch } from '@retailcrm/embed-ui-v1-components/remote'

      const enabled = ref(false)
      </script>
  - title: Controlled switch
    code: |
      <template>
        <UiSwitch
          :value="enabled"
          @update:value="enabled = $event"
        />
      </template>

      <script lang="ts" setup>
      import { ref } from 'vue'
      import { UiSwitch } from '@retailcrm/embed-ui-v1-components/remote'

      const enabled = ref(false)
      </script>
  - title: Disabled
    code: |
      <template>
        <UiSwitch :value="true" disabled />
      </template>

      <script lang="ts" setup>
      import { UiSwitch } from '@retailcrm/embed-ui-v1-components/remote'
      </script>
  - title: Square
    code: |
      <template>
        <UiSwitch v-model:value="enabled" square />

      </template>

      <script lang="ts" setup>
      import { ref } from 'vue'
      import { UiSwitch } from '@retailcrm/embed-ui-v1-components/remote'

      const enabled = ref(false)
      </script>
  - title: Settings row with label and hint
    code: |
      <template>
        <div class="settings-switch-row">
          <UiSwitch
            :id="switchId"
            v-model:value="enabled"
          />

          <div class="settings-switch-row__content">
            <label
              class="settings-switch-row__label"
              :for="switchId"
            >
              Enable automatic assignment
            </label>

            <div class="settings-switch-row__hint">
              New requests will be assigned to available managers.
            </div>
          </div>
        </div>
      </template>

      <script lang="ts" setup>
      import { ref, useId } from 'vue'

      import { UiSwitch } from '@retailcrm/embed-ui-v1-components/remote'

      const enabled = ref(false)
      const switchId = useId()
      </script>

      <style lang="less" scoped>
      @import (reference) '@retailcrm/embed-ui-v1-components/assets/stylesheets/layout.less';
      @import (reference) '@retailcrm/embed-ui-v1-components/assets/stylesheets/palette.less';
      @import (reference) '@retailcrm/embed-ui-v1-components/assets/stylesheets/typography.less';

      .settings-switch-row {
        display: flex;
        align-items: flex-start;
        gap: 3 * @spacing-unit;
      }

      .settings-switch-row__content {
        display: grid;
        gap: @spacing-xxs;
        min-width: 0;
      }

      .settings-switch-row__label {
        color: @black-500;
        .text-small-accent();
      }

      .settings-switch-row__hint {
        color: @grey-800;
        .text-small();
      }
      </style>
use_when:
  - You need a compact on or off toggle.

avoid_when:
  - You need checkbox-group semantics.
  - You need a UiField-style labeled wrapper; pair UiSwitch with a visible label and hint text instead.

api:
  key_props:
    - name: value
    - name: square
    - name: disabled
  methods:
    - name: click
    - name: focus
    - name: blur

rendered_structure:
  descriptive_only: true
  root:
    shape: span.ui-v1-switch
    tag: span
  notes: The root is one compact inline switch control.

geometry:
  layout: inline switch control
  root_display: inline-block
  width_behavior: content-sized by default

behavior:
  notes:
    - Best for immediate boolean settings, not for long-form confirmation choices.
    - Disabled blocks interaction while preserving the current state visually.

composition:
  works_well_with:
    - visible label
    - hint text
  patterns:
    - title: Settings row
      notes: Place UiSwitch on the left, label and hint on the right, and connect UiSwitch id with label for.
  avoid:
    - Do not use without a nearby label; the switch alone does not explain what will change.
    - Do not wrap UiSwitch in UiField.

ai_notes:
  do:
    - Use for compact feature toggles and enable or disable settings.
    - Generate an id, pass it to UiSwitch, and connect the visible label with label for.
    - Put helper text below the label in the settings row, not in UiField hint.
  avoid:
    - Do not use for multi-select lists or legal acknowledgements; use UiCheckbox.
    - Do not use UiField around UiSwitch.

accessibility:
  notes:
    - Prefer visible text labels for interactive controls.
    - For icon-only or custom visual content, provide an accessible name through the supported label, title, or ARIA attributes exposed by the component.
    - Preserve native keyboard semantics by using the component root instead of recreating the control with arbitrary markup.
  keyboard:
    - Tab moves focus to the control when it is focusable.
    - Enter or Space activates native button-like controls when the host implementation renders a button.

styling:
  notes:
    - Use documented props and slots as the primary styling API.
    - Internal .ui-v1-* classes are descriptive implementation details for reasoning and debugging unless a profile marks them as public theme hooks.
  root_classes:
    - .ui-v1-switch
