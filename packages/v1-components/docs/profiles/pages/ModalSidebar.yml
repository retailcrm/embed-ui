page_profile: ModalSidebar
summary: >
  Side-docked modal pattern for small contextual forms, local additional information,
  or compact entity cards.

use_when:
  - You need a small contextual form.
  - You need local additional information connected to the current page.
  - You need a compact entity card with a limited number of fields and settings.

examples_from_design:
  - task card
  - notifications
  - new ticket
  - scenario step editing

examples:
  - title: Footer actions
    code: |
      <template>
          <div>
              <UiButton @click="open = true">
                  Open sidebar
              </UiButton>

              <UiModalSidebar v-model:opened="open">
                  <template #title>
                      Title
                  </template>

                  <div class="modal-sidebar-example__body">
                      Sidebar content
                  </div>

                  <template #footer>
                      <div class="modal-sidebar-footer">
                          <div class="modal-sidebar-footer__main">
                              <UiButton @click="save">
                                  Save
                              </UiButton>

                              <UiButton appearance="secondary" @click="open = false">
                                  Close
                              </UiButton>
                          </div>

                          <div class="modal-sidebar-footer__aside">
                              <UiPopconfirm
                                  ok-variant="danger"
                                  title="Delete item?"
                                  @ok="deleteItem"
                              >
                                  <template #trigger="{ open: popconfirmOpen }">
                                      <UiButton
                                          :active="popconfirmOpen"
                                          aria-label="Delete"
                                          appearance="tertiary"
                                          class="modal-sidebar-footer__delete"
                                          variant="danger"
                                      >
                                          <IconDelete
                                              aria-hidden="true"
                                              class="modal-sidebar-footer__delete-icon"
                                          />
                                      </UiButton>
                                  </template>

                                  This action cannot be undone.
                              </UiPopconfirm>
                          </div>
                      </div>
                  </template>
              </UiModalSidebar>
          </div>
      </template>

      <script lang="ts" setup>
      import { ref } from 'vue'

      import IconDelete from '@retailcrm/embed-ui-v1-components/assets/sprites/ui/delete-outlined.svg'
      import {
        UiButton,
        UiModalSidebar,
        UiPopconfirm,
      } from '@retailcrm/embed-ui-v1-components/remote'

      const open = ref(false)

      const save = () => {
        open.value = false
      }

      const deleteItem = () => {
        open.value = false
      }
      </script>

      <style scoped>
      .modal-sidebar-example__body {
        min-height: 360px;
      }

      .modal-sidebar-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .modal-sidebar-footer__main {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .modal-sidebar-footer__aside {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .modal-sidebar-footer__delete.ui-v1-button {
        color: #8a96a6;
      }

      .modal-sidebar-footer__delete.ui-v1-button:hover,
      .modal-sidebar-footer__delete.ui-v1-button:focus-visible {
        color: #dd4040;
      }

      .modal-sidebar-footer__delete-icon {
        display: block;
        width: 24px;
        height: 24px;
      }
      </style>

size_rules:
  - Sidebar can use 720px width.
  - Sidebar can use 416px width.

expected_structure:
  - Fixed header at the top with title and close button.
  - Header can also contain extra text, icon, button, or tag.
  - If a sidebar opens from another sidebar, show a back arrow to return to the previous sidebar.
  - Fixed footer at the bottom.
  - Footer usually contains save, cancel or close, and delete actions.
  - Footer can also contain a copy button or auxiliary text.
  - Footer actions may be split into left and right groups.
  - Footer action groups usually use a 12px or 16px gap between neighboring buttons.
  - Destructive footer actions are often icon-only buttons aligned to the right edge.
  - Destructive icon-only actions should usually open UiPopconfirm with okVariant="danger"; its confirmation button is primary by default.
  - Content can be flexible, but should stay compact.
  - Default sidebar forms use one form or grid container with a consistent gap.
  - Each labeled textbox, select, number, date, or time control in a sidebar form should live in UiField.
  - Field-level errors should use UiError inside the corresponding UiField, directly after the control.
  - Bounded numeric sidebar fields should use UiNumberStepper unless stepper controls do not fit the product interaction.
  - Footer actions should be placed through the UiModalSidebar footer slot, usually primary save and secondary or tertiary cancel.
  - Sidebar titles should stay short enough for the available width.
  - Small tables can be placed in sidebars.

recommended_components:
  - name: UiModalSidebar
    profile: ../components/UiModalSidebar.yml
  - name: UiButton
    profile: ../components/UiButton.yml
  - name: UiPopconfirm
    profile: ../components/UiPopconfirm.yml
  - name: UiTag
    profile: ../components/UiTag.yml
  - name: UiField
    profile: ../components/UiField.yml
  - name: UiTextbox
    profile: ../components/UiTextbox.yml
  - name: UiNumberStepper
    profile: ../components/UiNumberStepper.yml
  - name: UiSelect
    profile: ../components/UiSelect.yml
  - name: UiError
    profile: ../components/UiError.yml
  - name: UiAlert
    profile: ../components/UiAlert.yml
  - name: UiTable
    profile: ../components/UiTable.yml
    notes: Use only for small, simple tables.

ai_notes:
  do:
    - Use for inspect, edit, or secondary workflows related to the current list or page.
    - Keep the flow compact.
    - Use a single local form/grid container for sidebar forms.
    - Put every labeled scalar form control in UiField and keep UiError inside that field.
    - Use the footer slot for save/cancel actions rather than a page footer component.
    - Split footer actions into meaningful left and right groups when secondary or destructive actions need separation.
    - Use 12px or 16px gaps inside each footer action group.
    - Put destructive icon-only actions on the right and confirm them with UiPopconfirm okVariant="danger"; the confirmation button is primary by default.
  avoid:
    - Do not use for bulky or complex interfaces.
    - Do not use collapse blocks inside sidebars.
    - Do not use two-column content on separate surfaces.
    - Do not use a two-column form inside a sidebar unless the product task explicitly requires it and the content still fits.
    - Do not place UiPageFooter inside UiModalSidebar.
    - Do not mix unrelated spacing strategies inside one sidebar form; keep gaps owned by the form container and local error margins.
    - Use a full page or modal window for bulky flows.
