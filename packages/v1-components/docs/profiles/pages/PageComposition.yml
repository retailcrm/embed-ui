page_profile: PageComposition
summary: >
  Shared page-composition rules for RetailCRM extension screens built with
  @retailcrm/embed-ui-v1-components.

use_after:
  - ../../README.md
  - ../../../AGENTS.md
  - ../../AI.md
  - ../components

scope:
  - Page-composition guidance for full pages, modals, sidebars, filters, tables, and settings layouts.
  - Complements component API profiles instead of replacing them.

shared_rules:
  - Page title uses the large accent text style, Text large Accent 24.
  - Page-level actions sit to the right of the title.
  - A full page should have at most one page-level primary button of each variant, Success Primary, Default Primary, and Danger Primary.
  - Use Success Primary for the page's strongest call to action when it creates or commits a result, such as Save, Apply, or Create.
  - Place the page-level Success Primary action in UiPageFooter for save or apply workflows.
  - Use Default Primary for an important action that is secondary to the Success Primary or does not commit a result.
  - Use Danger Primary only for one critical destructive action when the page needs it.
  - If several actions compete for attention, choose the main one for Success Primary and move the rest to Default Primary, secondary, tertiary, or dropdown actions by meaning.
  - Use secondary for a real neighboring command that should still read as a button.
  - Use tertiary for lower-emphasis header, card, inline, configure, edit, open, cancel, and close actions that should not compete with the main flow.
  - UiPageHeader actions and UiPageFooter actions belong to the same page-level action scope.
  - Treat each UiCollapseBox footer as a separate local action scope with the same rules scoped to that section.
  - A page can have several Default Primary buttons when each one belongs to a different UiCollapseBox footer.
  - Secondary actions should support or cancel the primary flow.
  - Components inside pages and blocks should be spaced by values divisible by 4px.
  - Common spacing values are 4, 8, 12, 16, 20, 24, 28, and 32px.
  - Content blocks commonly use 32px left, right, and bottom padding and 24px top padding.
  - The 24px top and 32px side/bottom padding rule belongs to white content surfaces, not to the page root wrapper.
  - Do not duplicate content-surface padding on the page root; outer page spacing is controlled by the CRM host layout.
  - Prefer public components from @retailcrm/embed-ui-v1-components/remote.
  - Do not invent custom chrome for pages, forms, tables, tabs, buttons, modals, or sidebars when a documented component fits.
  - For Vue remote pages and page-like components, prefer local CSS Modules with `<style module lang="less">`; use shared global styles only as an intentional feature-level abstraction.
  - Page-specific CSS Module class names should still describe the block they style, for example `entity-list__actions`, `settings-form__field-error`, or `modal-sidebar-form__footer`.
  - Use UiLoader for loading states, UiAlert variant="danger" for page-level API failures, and UiAlert variant="success" or an approved local success pattern for successful saves.
  - Use UiInfobox for richer explanatory empty states; use UiTable #empty when the empty state belongs directly to a table body.
  - If a column or dependent UI exists only for an enabled setting, render the column conditionally instead of showing empty cells.
  - Avoid loading expensive dependent API data when the setting that needs it is disabled.

decision_guide:
  - need: Searchable, filterable registry.
    use: EntityListPage
    profile: ./EntityListPage.yml
  - need: Entity editing or settings form.
    use: CardSettingsPage
    profile: ./CardSettingsPage.yml
  - need: Several semantic blocks visible together.
    use: MultiColumnPage
    profile: ./MultiColumnPage.yml
  - need: Grouped settings with independent sections.
    use: CollapseBlockPage
    profile: ./CollapseBlockPage.yml
  - need: Small contextual form or compact entity card.
    use: ModalSidebar
    profile: ./ModalSidebar.yml
  - need: Large local workflow, auxiliary table, or dense settings flow.
    use: ModalWindow
    profile: ./ModalWindow.yml

ai_notes:
  do:
    - Choose ModalSidebar only when the flow is compact.
    - Choose ModalWindow or a full page when content needs wide tables, several sections, or complex controls.
    - Keep operational CRM screens dense, scannable, and work-focused.
    - Prefer variant="success" for the main save/apply/create action and keep it visually dominant.
    - Prefer appearance="tertiary" for supportive actions that sit near content but should stay visually quiet.
    - Keep page-specific layout styles in CSS Modules unless the task records a shared styling abstraction.
    - Choose one documented loading, error, success, and empty-state pattern for the page before finishing.
  avoid:
    - Do not turn internal CRM work screens into marketing-style layouts.
    - Do not hide filters or primary workflow controls away from the content they affect.
    - Do not place multiple Success Primary, Default Primary, or Danger Primary actions with the same variant in the page-level scope or inside one collapse-box scope.
    - Do not default every non-primary action to appearance="secondary"; choose by local action importance.
    - Do not add page-surface padding to both the page root and the white content surface.
    - Do not use a shared `admin.less` or other global page stylesheet only to avoid local composition styles.
    - Do not show settings-dependent table columns as permanent empty placeholder columns.
