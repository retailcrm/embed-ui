name: Tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.10

  eslint:
    needs: workflow-lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.15.0 ]

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build worktree
        run: yarn workspaces foreach -A --topological-dev run build

      - name: Ensure root bin is generated
        run: test -s bin/embed-ui.mjs

      - name: Run eslint
        run: yarn eslint

  tests:
    needs: eslint

    timeout-minutes: 60

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.15.0 ]

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build worktree
        run: yarn workspaces foreach -A --topological-dev run build

      - name: Ensure root bin is generated
        run: test -s bin/embed-ui.mjs

      - name: Run tests
        run: yarn test

      - name: Run typecheck tests
        run: yarn test:typecheck

      - name: Install Playwright Chromium
        if: ${{ startsWith(matrix.node-version, '24.') }}
        run: yarn workspace @retailcrm/embed-ui-v1-sandbox exec playwright install --with-deps chromium

      - name: Run browser mode tests
        if: ${{ startsWith(matrix.node-version, '24.') }}
        run: yarn test:browser

      - name: Run end-to-end tests
        if: ${{ startsWith(matrix.node-version, '24.') }}
        run: yarn test:e2e

      - name: Upload browser artifacts on failure
        if: ${{ failure() && startsWith(matrix.node-version, '24.') }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-artifacts-${{ matrix.node-version }}
          path: |
            packages/*/artifacts/browser/screenshots
            packages/*/artifacts/playwright/screenshots
            packages/v1-sandbox/artifacts/playwright/results
            packages/v1-sandbox/playwright-report
          if-no-files-found: ignore
